[project]
name = "homebase"
version = "0.1.0"
description = "A-Team coordination server"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
homebase = "homebase.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
