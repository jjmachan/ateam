[project]
name = "ateam-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ateam = { workspace = true }
homebase = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ateam", "homebase"]

[tool.pytest.ini_options]
testpaths = ["packages/homebase/tests", "packages/ateam/tests"]
addopts = "--import-mode=importlib"
